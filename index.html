<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabelhelden">
<meta name="theme-color" content="#7B5CFA">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vokabel-Helden</title>
<style>
:root{
  --bg:#F4F0FF; --ink:#2B2350; --muted:#7A72A8; --line:#E3DCFA;
  --primary:#7B5CFA; --primary-d:#5B3FD6;
  --good:#22C58B; --good-d:#169968; --bad:#FF5D6C; --bad-d:#D63D4C;
  --sun:#FFC83D; --sun-d:#E0A400; --sky:#38B6FF; --card:#fff;
  --r:24px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12px 12px,rgba(123,92,250,.07) 2px,transparent 3px);
  background-size:36px 36px;
  min-height:100vh;min-height:100dvh;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior-y:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{max-width:880px;margin:0 auto;min-height:100vh;min-height:100dvh}
main.tab{padding:calc(16px + var(--safe-t)) 16px calc(104px + var(--safe-b))}
h1,h2,h3{margin:0}
h2{font-size:22px;font-weight:800}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 22px;border-radius:18px;font-weight:800;font-size:17px;
  background:var(--primary);color:#fff;box-shadow:0 5px 0 var(--primary-d);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d)}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-d)}
.btn.good:active{box-shadow:0 1px 0 var(--good-d)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.sun{background:var(--sun);color:#5A4200;box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:#fff;color:var(--primary-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.big{min-height:60px;font-size:20px;border-radius:22px;padding:0 30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:14px;box-shadow:0 3px 0 var(--primary-d)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.icon{width:44px;height:44px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:20px;font-weight:800}
.link{color:var(--primary-d);font-weight:700;text-decoration:underline;font-size:15px;padding:8px}

/* Hero */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.owl{font-size:56px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px 14px;font-weight:700;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip-s{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}

/* Karten allgemein */
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 5px 0 var(--line)}
.panel h3{font-size:17px;margin-bottom:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:92px;min-height:48px;border-radius:16px;background:#fff;border:2px solid var(--line);
  font-weight:800;font-size:15px;padding:6px 10px;line-height:1.2
}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary-d);box-shadow:0 4px 0 var(--primary-d)}
.seg button small{display:block;font-weight:600;font-size:11px;opacity:.8}

/* Seitenkarten */
.rowtools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 10px}
.pgcard{
  display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:20px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;
}
.pgcard.sel{border-color:var(--primary);background:#F1ECFF}
.chk{
  flex:none;width:34px;height:34px;border-radius:11px;border:3px solid var(--line);display:grid;place-items:center;
  font-weight:900;color:transparent;background:#fff;font-size:20px;
}
.pgcard.sel .chk{background:var(--primary);border-color:var(--primary-d);color:#fff}
.pgmain{flex:1;min-width:0}
.pgtitle{font-weight:800;font-size:18px}
.pgsub{font-size:14px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgst{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:5px;line-height:1.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}
.pgst .dot:first-child{margin-left:0}
.legend{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.legend .dot{margin-left:0;margin-right:5px}
.grp{margin-bottom:10px}
.grphead{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;cursor:pointer}
.grp.open .grphead{border-color:#CFC4FF}
.grphead .chev{flex:none;font-size:22px;color:var(--muted);width:22px;text-align:center}
.grpbody{display:none;margin:8px 0 0 20px;padding-left:12px;border-left:4px solid var(--line)}
.grp.open .grpbody{display:block}
.grpbody .pgcard:last-child{margin-bottom:2px}
.chk.some{background:#E5DEFF;border-color:var(--primary);color:var(--primary-d)}
.chk.all{background:var(--primary);border-color:var(--primary-d);color:#fff}
.plnote{font-size:14px;font-weight:700;color:var(--muted);margin-left:6px}
.editbtn{position:absolute;top:8px;right:8px;width:38px;height:38px;font-size:17px;opacity:.8;z-index:2}
.srch{width:100%;font-size:17px;padding:12px 14px;border:3px solid var(--line);border-radius:16px;background:#fff;font-family:inherit}
.srch:focus{outline:none;border-color:var(--primary)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#EFEAFF}
.stack i{display:block;height:100%}
.startbar{
  position:fixed;left:0;right:0;bottom:calc(76px + var(--safe-b));padding:0 16px;z-index:20;
  display:flex;justify-content:center;pointer-events:none
}
.startbar .btn{pointer-events:auto;width:100%;max-width:560px;box-shadow:0 5px 0 var(--primary-d),0 12px 24px rgba(91,63,214,.3)}

/* Navigation */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + var(--safe-b))
}
nav.tabs .in{display:flex;max-width:880px;width:100%;gap:6px}
nav.tabs button{flex:1;padding:6px 2px;border-radius:14px;font-weight:800;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:24px;line-height:1}
nav.tabs button.on{background:#F1ECFF;color:var(--primary-d)}

/* Töpfe */
.pots{display:flex;gap:4px;align-items:flex-end}
.pot{flex:1;min-width:0;position:relative;text-align:center;transition:transform .2s}
.pot svg{width:100%;height:auto;max-width:92px;display:block;margin:0 auto;overflow:visible}
.pot .cap{font-size:11px;font-weight:800;color:var(--muted);margin-top:1px;white-space:nowrap}
.pot .badge{
  position:absolute;top:-6px;right:50%;margin-right:-34px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;
  background:var(--ink);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;border:2px solid #fff
}
.pot.src{transform:translateY(-8px);filter:drop-shadow(0 0 10px rgba(255,200,61,.95))}
.pot.src:after{content:"▼";position:absolute;top:-20px;left:0;right:0;font-size:14px;color:var(--sun-d);animation:nudge .8s infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.pot.tap{cursor:pointer}
.steam{animation:steam 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.8;transform:translateY(-3px)}}

/* Quiz */
.quiz{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:calc(10px + var(--safe-t)) 14px calc(10px + var(--safe-b));overflow:hidden}
.qmain{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:2px 2px 10px}
.qleft{display:flex;flex-direction:column}
.qtop{display:flex;gap:10px;align-items:center}
.prog{flex:1;height:16px;background:#E8E1FF;border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--primary));border-radius:10px;transition:width .4s}
.score{font-weight:800;min-width:56px;text-align:right}
.qdir{align-self:center;margin:12px 0 8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px}
.qcard{
  background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px 18px;text-align:center;
  box-shadow:0 7px 0 var(--line);position:relative;
}
.qcard.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.qcard.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-12px) scale(1.02)}60%{transform:translateY(0) scale(.99)}}
.qprompt{font-size:clamp(30px,7vw,52px);font-weight:800;line-height:1.15;margin:8px 0 4px;word-break:break-word}
.qipa{font-size:22px;color:var(--primary-d);font-weight:700;letter-spacing:.3px;min-height:1.2em}
.qhint{font-size:14px;color:var(--muted);font-weight:700}
.audio{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.audio .btn{min-height:46px;font-size:15px;padding:0 14px;border-radius:16px}
.audio .btn.ghost{box-shadow:0 3px 0 var(--line)}
.ans{margin-top:14px}
.mic{
  width:104px;height:104px;border-radius:50%;background:var(--bad);color:#fff;font-size:44px;
  box-shadow:0 7px 0 var(--bad-d);display:grid;place-items:center;margin:4px auto 18px;position:relative;transition:transform .08s
}
.mic:active{transform:translateY(5px);box-shadow:0 2px 0 var(--bad-d)}
.mic.live{background:var(--good);box-shadow:0 7px 0 var(--good-d)}
.mic.live:before,.mic.live:after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--good);animation:ring 1.4s infinite}
.mic.live:after{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.heard{min-height:30px;font-size:20px;font-weight:700;color:var(--primary-d);margin-top:6px}
.wform{display:flex;gap:10px;align-items:stretch}
.wform input{
  flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:16px;
  border:3px solid var(--line);outline:none;background:#fff;color:var(--ink);text-align:center
}
.wform input:focus{border-color:var(--primary)}
.wform input::placeholder{font-size:17px;font-weight:600;color:#A79FCB}
.pattern{font-size:26px;letter-spacing:5px;font-weight:800;color:var(--primary-d);margin-bottom:8px}
.skip{display:block;margin:10px auto 0}
.fb{margin-top:14px;border-radius:24px;padding:14px 16px;text-align:center;border:3px solid}
.fb.ok{background:#E6FAF2;border-color:var(--good)}
.fb.bad{background:#FFEEF0;border-color:var(--bad)}
.fbhead{font-size:22px;font-weight:800;margin-bottom:6px}
.fb.ok .fbhead{color:var(--good-d)}.fb.bad .fbhead{color:var(--bad-d)}
.sol{font-size:22px;font-weight:800;line-height:1.3}
.sol .ipa{color:var(--primary-d);font-size:18px;font-weight:700}
.sol .de{font-weight:700;color:var(--ink)}
.fb .btn.next{margin-top:12px;width:100%}
.potwrap{flex:none;padding-top:8px}
.potwrap .pots{background:rgba(255,255,255,.65);border:2px solid var(--line);border-radius:22px;padding:14px 8px 8px}
.sideowl{display:none}

/* iPad quer (und Desktop): Frage links, Lösung rechts, Töpfe groß und fest unten */
@media (min-width:760px) and (min-height:560px) and (min-aspect-ratio:13/10){
  .quiz{padding:calc(12px + var(--safe-t)) 22px calc(12px + var(--safe-b))}
  .qmain{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-content:start}
  .qdir{margin:4px 0 10px}
  .qcard{padding:14px 18px}
  .qprompt{font-size:clamp(30px,4.4vw,50px);margin:4px 0 2px}
  .qipa{font-size:20px}
  .audio{margin:8px 0 2px}
  .ans{margin-top:8px}
  .mic{width:84px;height:84px;font-size:36px;margin:2px auto 12px}
  .qright{padding-top:6px}
  .sideowl{display:block;text-align:center;font-size:100px;margin-top:26px;animation:bob 3s ease-in-out infinite}
  .sideowl small{display:block;font-size:18px;color:var(--muted);font-weight:800;margin-top:6px}
  .fb{margin-top:0}
  .potwrap{padding-top:10px}
  .potwrap .pots{gap:10px;padding:18px 14px 10px}
  .pot svg{max-width:min(128px,10vw)}
  .pot .cap{font-size:14px;margin-top:3px}
  .pot .badge{min-width:28px;height:28px;font-size:15px;margin-right:-50px}
}

/* Spruch-Banner */
.cheer{position:fixed;left:50%;top:57%;z-index:220;pointer-events:none;font-weight:900;font-size:clamp(34px,6.8vw,72px);line-height:1.08;text-align:center;max-width:92vw;color:#fff;transform:translate(-50%,-50%);
  text-shadow:-3px -3px 0 var(--o,#5B3FD6),3px -3px 0 var(--o,#5B3FD6),-3px 3px 0 var(--o,#5B3FD6),3px 3px 0 var(--o,#5B3FD6),0 7px 0 var(--o,#5B3FD6),0 14px 24px rgba(0,0,0,.25)}
.cheer.big{font-size:clamp(40px,8vw,88px)}

/* Fliegende Chips & Konfetti */
.chip{
  position:fixed;z-index:200;pointer-events:none;background:#fff;border:3px solid var(--primary);color:var(--ink);
  font-weight:800;font-size:20px;padding:8px 16px;border-radius:16px;box-shadow:0 8px 20px rgba(43,35,80,.25);white-space:nowrap;
  max-width:70vw;overflow:hidden;text-overflow:ellipsis
}
.chip.ok{border-color:var(--good)}.chip.bad{border-color:var(--bad)}
.confetti{position:fixed;z-index:210;pointer-events:none;font-size:22px}

/* Fertig-Screen */
.sum{padding:calc(24px + var(--safe-t)) 18px calc(28px + var(--safe-b));text-align:center;max-width:620px;margin:0 auto}
.stars{font-size:64px;letter-spacing:6px;margin:6px 0}
.stars .off{filter:grayscale(1);opacity:.25}
.bigowl{font-size:96px;animation:bob 2.4s ease-in-out infinite}
.sumlist{text-align:left;margin:14px 0}
.sumrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-bottom:8px}
.sumrow b{flex:1}
.sumrow .tag{font-weight:800}
.sumrow.good .tag{color:var(--good-d)}.sumrow.bad .tag{color:var(--bad-d)}

/* Listen / Formulare */
.wrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .t{flex:1;min-width:0}
.wrow .en{font-weight:800;font-size:17px}
.wrow .ipa{color:var(--primary-d);font-weight:700;font-size:14px;margin-left:6px}
.wrow .de{color:var(--muted);font-size:15px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:800;font-size:14px;margin-bottom:4px}
.field input,.field textarea,.field select{
  width:100%;font:inherit;font-size:17px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none
}
.field textarea{min-height:200px;font-size:16px;line-height:1.45;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary)}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.sub{padding:calc(14px + var(--safe-t)) 16px calc(40px + var(--safe-b));max-width:760px;margin:0 auto}
.subtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.subtop h2{flex:1}
.note{background:#FFF8DD;border:2px solid #FFE08A;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.warn{background:#FFEEF0;border:2px solid #FFC0C7}
ol.steps{margin:6px 0 10px;padding-left:22px;line-height:1.5;font-size:15px}
.prompt{background:#F4F0FF;border:2px dashed var(--primary);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;margin:8px 0;-webkit-user-select:text;user-select:text}
table.prev{width:100%;border-collapse:collapse;font-size:15px}
table.prev td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.prev td:first-child{font-weight:800}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:54px;height:32px;border-radius:16px;background:#D8D0F5;position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--good)}.sw.on:after{left:25px}
input[type=range]{width:100%;accent-color:var(--primary)}

/* Foto-Scan */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.thumbs img{height:110px;width:auto;border-radius:12px;border:2px solid var(--line)}
.scanbusy{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:18px;background:#F1ECFF;border:2px dashed var(--primary)}
.scanbusy .owl{font-size:44px}
.scanbusy .dots:after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
details.how summary{font-weight:800;cursor:pointer;margin:12px 0 4px;color:var(--primary-d)}
.note.ok{background:#E6FAF2;border-color:#9BE3C6}

/* Modal / Toast */
.overlay{position:fixed;inset:0;background:rgba(43,35,80,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:640px;max-height:86vh;overflow:auto;padding:18px 18px calc(24px + var(--safe-b))}
.sheet.center{border-radius:28px;margin:auto 16px;align-self:center}
.sheet h3{font-size:20px;margin-bottom:10px}
.sheet .btns{display:flex;gap:10px;margin-top:14px}
.sheet .btns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:300;max-width:90vw;text-align:center}

@media (min-width:700px){
  .qcard{padding:28px}
  .pot svg{max-width:96px}
}
@media (max-height:640px){
  .qprompt{font-size:28px}.mic{width:84px;height:84px;font-size:34px}
}
@media (prefers-reduced-motion:reduce){.owl,.bigowl,.steam{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================================
   Vokabel-Helden – eine Datei, keine Abhängigkeiten, Daten im Browser

/* ---------- Text-Import ---------- */
function splitCols(line){
  let depth=0, cols=[], cur='';
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='('||ch==='[') depth++;
    if(ch===')'||ch===']') depth=Math.max(0,depth-1);
    if(depth===0){
      if(ch==='\t'||ch==='|'){ cols.push(cur); cur=''; continue; }
      if(ch==='=' && /\s/.test(line[i-1]||'') && /\s/.test(line[i+1]||'')){ cols.push(cur); cur=''; continue; }
    }
    cur+=ch;
  }
  cols.push(cur);
  return cols.map(s=>s.trim());
}
function parseEntry(cols){
  const ipaGroups=[];
  let en=(cols[0]||'').replace(/\[([^\]]*)\]/g,(m,g)=>{ ipaGroups.push(g.trim()); return ' '; });
  en=en.replace(/\s+/g,' ').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
  const de=(cols[1]||'').replace(/\s+/g,' ').trim();
  const w={ en, ipa:ipaGroups.filter(Boolean).join(' · '), de };
  if(cols[2]){ const ok=cols[2].split(/[;]/).map(s=>s.trim()).filter(Boolean); if(ok.length) w.deOk=ok; }
  return w;
}
function parseVocabText(text, defPage, defTitle){
  const pages=[]; let cur=null; const warnings=[];
  const ensure=()=>{ if(!cur){ cur={page:defPage||null,title:defTitle||'',words:[]}; pages.push(cur);} return cur; };
  String(text||'').split(/\r?\n/).forEach((raw,idx)=>{
    const line=raw.trim();
    if(!line || line.startsWith('//')) return;
    const hm=line.match(/^#\s*(?:seite|page|s\.|p\.)?\s*(\d+)\s*(?:[|:–—-]\s*)?(.*)$/i);
    if(hm){ cur={page:+hm[1],title:hm[2].trim(),words:[]}; pages.push(cur); return; }
    const cols=splitCols(line);
    if(cols.length<2 || !cols[0] || !cols[1]){ warnings.push(`Zeile ${idx+1} übersprungen (kein „|“ gefunden): ${line.slice(0,50)}`); return; }
    ensure().words.push(parseEntry(cols));
  });
  pages.forEach(p=>{ if(!p.title) p.title = p.title || defTitle || ''; });
  return {pages:pages.filter(p=>p.words.length), warnings};
}

/* ---------- Topf-Logik ---------- */
// Stufen: -1 = Falsch-Topf, 0 = neu (noch nie gefragt), 1..4 = Töpfe, 5 = erledigt (5x richtig)
function nextLevel(lvl, ok){
  if(ok){
    if(lvl<=0) return 1;
    if(lvl>=MAXPOT) return MAXPOT+1;
    return lvl+1;
  }
  if(lvl<=1) return -1;
  if(lvl>MAXPOT) return MAXPOT;
  return lvl-1;
}
const WEIGHT = {'-1':6, 0:3, 1:4, 2:3, 3:2, 4:1.2, 5:0.4};

function buildItems(pageIds, dirs, includeDone){
  const items=[];
  pageIds.forEach(pid=>{ const p=getPage(pid); if(!p) return;
    p.words.forEach(w=>dirs.forEach(d=>{
      const lvl=getLvl(w.id,d);
      if(includeDone || lvl<=MAXPOT) items.push({w,d,lvl,pageId:pid});
    }));
  });
  return items;
}
function weightedPick(items, n){
  const pool=[...items], out=[];
  while(out.length<n && pool.length){
    const tot=pool.reduce((s,i)=>s+(WEIGHT[i.lvl]??1),0);
    let r=Math.random()*tot, k=0;
    for(;k<pool.length;k++){ r-=(WEIGHT[pool[k].lvl]??1); if(r<=0) break; }
    out.push(pool.splice(Math.min(k,pool.length-1),1)[0]);
  }
  return out;
}
function spreadSameWord(arr){
  const a=[...arr];
  for(let i=1;i<a.length;i++){
    if(a[i].w.id===a[i-1].w.id){
      let j=i+1; while(j<a.length && a[j].w.id===a[i-1].w.id) j++;
      if(j<a.length) [a[i],a[j]]=[a[j],a[i]];
    }
  }
  return a;
}

/* ---------- Antworten prüfen ---------- */
const ART_EN=/^(the|a|an)\s+/, ART_DE=/^(der|die|das|ein|eine|einen|einem|einer)\s+/;
const NUM_EN={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','13':'thirteen','14':'fourteen','15':'fifteen','16':'sixteen','17':'seventeen','18':'eighteen','19':'nineteen','20':'twenty'};
const NUM_DE={'0':'null','1':'eins','2':'zwei','3':'drei','4':'vier','5':'fuenf','6':'sechs','7':'sieben','8':'acht','9':'neun','10':'zehn','11':'elf','12':'zwoelf','13':'dreizehn','14':'vierzehn','15':'fuenfzehn','16':'sechzehn','17':'siebzehn','18':'achtzehn','19':'neunzehn','20':'zwanzig'};
const HOMO_EN={to:'two',too:'two',won:'one',for:'four',fore:'four',ate:'eight',wear:'where',ware:'where',meat:'meet',eye:'i',u:'you',ewe:'you',hey:'hi',hay:'hi'};
const stripParens = s => String(s).replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
// Mehrzahl-Hinweis abtrennen: "fish, pl fish" / "fish (pl fish)" / "people (pl)" -> Wort + Mehrzahl
function splitPl(str){
  const t=String(str==null?'':str).trim();
  const m=t.match(/^(.*?)\s*(?:[,;]\s*|\(\s*|\s)pl\.?:?(?:\s+([^()]*?))?\s*\)?\s*$/i);
  if(!m || !m[1].trim()) return {head:t, pl:''};
  return {head:m[1].trim().replace(/[,;]\s*$/,''), pl:(m[2]||'').trim()};
}
// Klammern: Inhalt ist wahlweise dabei oder nicht. "listen (to)" -> "listen" und "listen to".
// Hinweise wie (= I am), (wörtlich: ...), (Pl.), (D) werden nie mitgesprochen/mitverlangt.
const SKIP_PAR=/^(=|w[öo]rtl|pl\b|sg\b|bes\b|auch\b|meist|oft\b|z\.\s?b|etw|jdn|jdm|jd\b|d\b|akk|dat|brit|amer|infml|informal)/i;
function parenVariants(str, maxWords){
  const t=String(str==null?'':str), groups=[], re=/\(([^)]*)\)/g; let m;
  while((m=re.exec(t))){
    const c=m[1].trim();
    groups.push({a:m.index, b:m.index+m[0].length, c, opt: !!c && !SKIP_PAR.test(c) && !/[;,\/]/.test(c) && c.split(/\s+/).length<=maxWords});
  }
  const opt=groups.filter(g=>g.opt).slice(0,3), out=new Set();
  for(let mask=0; mask<(1<<opt.length); mask++){
    let r='', pos=0;
    groups.forEach(g=>{ r+=t.slice(pos,g.a); pos=g.b; const i=opt.indexOf(g); if(i>=0 && ((mask>>i)&1)) r+=g.c; });
    r+=t.slice(pos);
    out.add(r.replace(/\s+/g,' ').trim());
  }
  return [...out].filter(Boolean);
}
const longestVariant=(str,maxW)=>parenVariants(str,maxW).sort((a,b)=>b.length-a.length)[0]||'';
const enDisp=w=>splitPl(w.en).head;
const enPl=w=>splitPl(w.en).pl;
const enListTxt=w=>enDisp(w)+(enPl(w)?' · Mehrzahl: '+enPl(w):'');
const plNoteHTML=w=>enPl(w)?` <span class="plnote">Mehrzahl: ${esc(enPl(w))}</span>`:'';
function normBase(s){
  return String(s).toLowerCase().replace(/[’‘´`]/g,"'")
    .replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/\.{2,}|…/g,' ').replace(/[.,!?;:"„“”«»()\[\]\/]/g,' ').replace(/\s+/g,' ').trim();
}
function expandContr(s){
  return s.replace(/\bi'm\b/g,'i am').replace(/\b(you|we|they)'re\b/g,'$1 are')
    .replace(/\b(what|where|who|how|it|that|here|there|he|she)'s\b/g,'$1 is');
}
function canon(s, lang, homo){
  return s.split(' ').map(t=>{
    t = (lang==='en' ? NUM_EN : NUM_DE)[t] || t;
    if(homo && lang==='en') t = HOMO_EN[t] || t;
    return t;
  }).join(' ');
}
function answersFor(w, lang){
  const set=new Set();
  const add=(s)=>{
    s=normBase(s); if(!s) return;
    const forms = lang==='en' ? [s, expandContr(s)] : [s];
    forms.forEach(x=>{
      set.add(x);
      const y=x.replace(lang==='en'?ART_EN:ART_DE,'');
      if(y) set.add(y);
    });
  };
  const addP=(str,mw)=>parenVariants(str,mw).forEach(add);
  if(lang==='en'){
    addP(splitPl(w.en).head,3);
    for(const m of String(w.en).matchAll(/\(\s*=\s*([^)]*)\)/g)) add(m[1]);
    (w.enOk||[]).forEach(x=>addP(x,3));
  }else{
    const parts=parenVariants(w.de,2);
    parts.forEach(add);
    if(w.deOk && w.deOk.length) w.deOk.forEach(x=>addP(x,2));
    else parts.forEach(v=>v.split(/[;,\/]/).map(x=>x.trim()).filter(x=>x.length>=2).forEach(add));
  }
  return [...set];
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function tolerance(len){ return len<=4 ? 0 : len<=8 ? 1 : 2; }
// Gesprochen: großzügig (Erkennung ist nicht perfekt)
function matchSpoken(w, lang, heardList, strict){
  const acc=answersFor(w,lang).map(a=>canon(a,lang,true));
  for(const h of heardList){
    const hc=canon(normBase(h),lang,true);
    if(!hc) continue;
    for(const a of acc){
      if(hc===a || (!strict && lev(hc,a)<=tolerance(a.length))) return true;
    }
  }
  return false;
}
// Geschrieben: genau (Groß-/Kleinschreibung und Satzzeichen egal, Rechtschreibung nicht)
function matchTyped(w, lang, typed){
  const acc=answersFor(w,lang).map(a=>canon(a,lang,false));
  const t=canon(normBase(typed),lang,false);
  return !!t && acc.includes(t);
}
function typedHint(w, lang){
  const ans=answersFor(w,lang).sort((a,b)=>b.length-a.length)[0] || '';
  const full = lang==='en' ? stripParens(enDisp(w)) : stripParens(w.de).split(/[;,\/]/)[0].trim();
  return full.split('').map((ch,i)=> i===0 ? ch : (/[A-Za-zÄÖÜäöüß]/.test(ch) ? '_' : ch)).join(' ');
}

const TTS_OK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

const vlang = v => String(v.lang||'').replace('_','-').toLowerCase();
function bestVoice(lang){
  const pref = lang==='en' ? DB.settings.enVoice : DB.settings.deVoice;
  const all=VOICES.filter(v=>vlang(v).startsWith(lang));
  if(!all.length) return null;
  if(pref){ const p=all.find(v=>v.voiceURI===pref); if(p) return p; }
  const exact=all.filter(v=>vlang(v)===(lang==='en'?'en-gb':'de-de'));
  const pool=exact.length?exact:all;
  const score=v=>(/premium|enhanced|erweitert|verbessert/i.test(v.name)?10:0)+(/siri/i.test(v.name)?5:0)+(v.localService?1:0)
    -(/compact|eloquence|novelty|whisper|bad news|bahh|boing|bells|bubbles|cellos|deranged|good news|hysterical|organ|trinoids|zarvox|jester|superstar|grandma|grandpa|flo|reed|rocko|sandy|shelley|eddy/i.test(v.name)?20:0);
  return [...pool].sort((a,b)=>score(b)-score(a))[0];
}
function speakText(w, lang){
  if(lang==='en') return longestVariant(splitPl(w.enSay || w.en).head,3).replace(/\.{2,}|…/g,' ').replace(/\s+/g,' ').trim();
  return longestVariant(w.deSay || w.de,2).replace(/\.{2,}|…/g,' ').replace(/\//g,', ').replace(/\s+/g,' ').trim();
}
let speakToken=0;
function say(text, lang, rate){
  return new Promise(resolve=>{
    if(!TTS_OK || !text){ resolve(); return; }
    const tok=++speakToken;
    try{ if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); }catch(e){}
    setTimeout(()=>{
      if(tok!==speakToken){ resolve(); return; }
      const u=new SpeechSynthesisUtterance(text);
      u.lang = lang==='en' ? 'en-GB' : 'de-DE';
      const v=bestVoice(lang); if(v) u.voice=v;
      u.rate=rate ?? DB.settings.rate; u.pitch=1; u.volume=1;
      u.onend=u.onerror=()=>resolve();
      try{ speechSynthesis.speak(u); }catch(e){ resolve(); }
    }, 60);
  });
}
function stopSpeaking(){ speakToken++; try{ if(TTS_OK) speechSynthesis.cancel(); }catch(e){} }
async function sayWord(w, kind){
  if(kind==='en') return say(speakText(w,'en'),'en',DB.settings.rate);
  if(kind==='de') return say(speakText(w,'de'),'de',DB.settings.rate);
  if(kind==='slow') return say(speakText(w,'en'),'en',0.45);

    const letters=speakText(w,'en').replace(/[^A-Za-z]/g,' ').split(/\s+/).join(' ');
    const spelled=[...letters.replace(/\s/g,'')].map(c=>c.toUpperCase()).join(', ');
    await say(spelled,'en',0.6);
    return;
  }
}

let AC=null;
function beep(seq){
  if(!DB.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const t0=AC.currentTime;
    seq.forEach(([f,t,d,type])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+t);
      g.gain.exponentialRampToValueAtTime(0.16,t0+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+t+d);
      o.connect(g); g.connect(AC.destination); o.start(t0+t); o.stop(t0+t+d+0.03);
    });
  }catch(e){}
}
const SND={
  ok:(n=0)=>{
    const sets=[[[660,0,.12],[880,.1,.2]],[[523,0,.1],[659,.09,.1],[784,.18,.2]],[[784,0,.1],[988,.08,.1],[1318,.16,.22]],[[440,0,.08],[880,.07,.08],[660,.14,.2]]];

function fxTick(ts){

/* ---------- Flug der Vokabel: Karte -> Topf, in dem sie liegt -> Ziel-Topf ---------- */
function pathAnimate(chip,p0,p1,dur,lift,o={}){
  const N=20, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, fr=[];
  const s0=o.s0??1, s1=o.s1??1, r0=o.r0??0, r1=o.r1??0;
  for(let i=0;i<=N;i++){
    const t=i/N, e=ease(t);
    const x=p0.x+(p1.x-p0.x)*e, y=p0.y+(p1.y-p0.y)*e-lift*4*e*(1-e);
    const sc=s0+(s1-s0)*e+(o.pulse||0)*Math.sin(Math.PI*e);
    const rot=r0+(r1-r0)*e+(o.wobble||0)*Math.sin(e*Math.PI*5)*(1-e);
    fr.push({transform:`translate(${x}px,${y}px) scale(${sc}) rotate(${rot}deg)`,offset:t});
  }
  return chip.animate(fr,{duration:dur,easing:'linear',fill:'forwards'});
}
function flyJourney(o){
  const chip=document.createElement('div'); chip.className='chip '+(o.ok?'ok':'bad'); chip.textContent=o.text;
  chip.style.left='0'; chip.style.top='0'; chip.dataset.fly='1';
  document.body.appendChild(chip);
  const w=chip.offsetWidth, h=chip.offsetHeight;
  const ctr=r=>({x:r.left+r.width/2-w/2, y:r.top+r.height/2-h/2});
  const top=el=>{ const r=el.getBoundingClientRect(); return {x:r.left+r.width/2-w/2, y:r.top+r.height*.24-h/2}; };
  const A=ctr(o.fromRect);
  const P1=o.srcEl?top(o.srcEl):A, P2=o.dstEl?top(o.dstEl):P1;
  const same=Math.abs(P1.x-P2.x)<2&&Math.abs(P1.y-P2.y)<2, dist=Math.hypot(P2.x-P1.x,P2.y-P1.y);
  let finished=false;
  const finish=()=>{ if(finished) return; finished=true; chip.remove(); o.onLand&&o.onLand(P2.x+w/2,P2.y+h/2); };
  setTimeout(finish,3300);   // Sicherheitsnetz
  // 1) Die Karte fällt in den Topf, in dem die Vokabel bisher lag (neue: in den Neu-Stapel)
  const leg1=pathAnimate(chip,A,P1,560,0,{s0:1,s1:.55,r0:0,r1:o.ok?-8:8});
  leg1.onfinish=()=>{
    if(finished) return;
    o.onDrop&&o.onDrop();
    // 2) ...und springt von dort im Bogen in den Ziel-Topf
    setTimeout(()=>{
      if(finished) return;
      const lift=same?90:Math.max(120,Math.min(260,dist*.45));
      const leg2=pathAnimate(chip,P1,P2,same?650:900,lift,{s0:.5,s1:.4,pulse:.55,r0:-10,r1:o.ok?(P2.x>=P1.x?360:-360):0,wobble:o.ok?0:18});
      leg2.onfinish=finish;
    },140);
  };
}

  if(!s.days.includes(t)){ s.days.push(t); s.days=s.days.slice(-400); }
  if(s.today.d!==t) s.today={d:t,n:0};
  s.today.n++; ok ? s.right++ : s.wrong++;
}

function selectedPages(){ return DB.settings.selected.filter(id=>getPage(id)); }
function dirsFromSetting(){ return DB.settings.dir==='mix' ? ['de-en','en-de'] : [DB.settings.dir]; }
function startCount(){
  const items=buildItems(selectedPages(), dirsFromSetting(), false);
  const n=DB.settings.size==='all' ? items.length : Math.min(+DB.settings.size, items.length);
  return {pool:items.length, n};
}
// Seiten gruppieren (manuelle Gruppe, sonst Überschrift) und Status pro Vokabel
function pageGroups(){
  const map=new Map();
  DB.pages.forEach(p=>{
    const name=String(p.group||p.title||'').trim(), key=name.toLowerCase()||'_';
    if(!map.has(key)) map.set(key,{key,name:name||'Ohne Überschrift',pages:[]});
    map.get(key).pages.push(p);
  });
  return [...map.values()];
}
function groupDefaultOpen(key){ const g=pageGroups().find(x=>x.key===key); return !!g && g.pages.some(p=>DB.settings.selected.includes(p.id)); }
function wordStatus(words,dirs){
  const r={n:words.length,neu:0,ueben:0,fertig:0};
  words.forEach(w=>{ const ls=dirs.map(d=>getLvl(w.id,d));
    if(ls.every(l=>l===0)) r.neu++; else if(ls.every(l=>l===DONE)) r.fertig++; else r.ueben++; });
  return r;
}
function statusHTML(st){
  const seg=[[st.neu,'#CFC8F0'],[st.ueben,'#FFB454'],[st.fertig,'#2ED3A5']].map(([v,c])=>v&&st.n?`<i style="width:${v/st.n*100}%;background:${c}"></i>`:'').join('');
  return `<div class="pgst"><span class="dot" style="background:#CFC8F0"></span>${st.neu} neu<span class="dot" style="background:#FFB454"></span>${st.ueben} am Üben<span class="dot" style="background:#2ED3A5"></span>${st.fertig} fertig</div><div class="stack">${seg}</div>`;
}

function potSheet(d, k){
  const key = k==='w' ? -1 : k==='n' ? 0 : +k;
  const list=buildItems(DB.pages.map(p=>p.id),[d],true).filter(i=>i.lvl===key);
  const from=DIRS[d].from, N=list.length;
  const title = k==='n' ? '📦 Neu-Stapel' : k==='w' ? 'Falsch-Topf' : +k===DONE ? 'Erledigt 🏆' : 'Topf '+k;
  const up = +k+1===DONE ? 'Fertig' : 'Topf '+(+k+1), down = +k<=1 ? 'Falsch-Topf' : 'Topf '+(+k-1);
  const hint = k==='n' ? 'Noch nie gefragt. Richtig → Topf 1, falsch → Falsch-Topf.'
    : k==='w' ? 'Richtig beantwortete Vokabeln wandern in Topf 1.'
    : +k===DONE ? 'Zur Wiederholung. Falsch heißt: zurück in Topf '+MAXPOT+'.'
    : `Richtig → ${up}, falsch → ${down}.`;
  const sizes=[10,20].filter(x=>x<N);
  const modes=[['speak','🎤 Sprechen'],['write','⌨️ Schreiben'],['reveal','🃏 Aufdecken']];
  showSheet(`<h3>${title} (${N})</h3><p class="small muted" style="margin:0 0 6px">${hint}</p>

      <div class="seg" style="margin-top:10px">${modes.map(([v,t])=>`<button data-act="sheetMode" data-v="${v}" data-d="${d}" data-k="${k}" class="${DB.settings.mode===v?'on':''}">${t}</button>`).join('')}</div>`:''}

}

function searchHTML(query){
  const q=normBase(query||''); if(!q) return '';
  const hits=[];
  DB.pages.forEach(p=>p.words.forEach(w=>{
    const hay=normBase([w.en,w.de,...(w.deOk||[]),...(w.enOk||[])].join(' | '));
    if(!hay.includes(q)) return;
    const starts = normBase(enDisp(w)).startsWith(q) || normBase(w.de).startsWith(q);
    hits.push({p,w,r:starts?0:1});
  }));
  hits.sort((a,b)=>a.r-b.r);
  if(!hits.length) return `<div class="panel">Nichts gefunden für „${esc(query.trim())}“.</div>`;
  const shown=hits.slice(0,60);
  return `<div class="panel"><div class="small muted" style="margin-bottom:4px">${hits.length} Treffer${hits.length>shown.length?' (die ersten '+shown.length+')':''}</div>
    ${shown.map(({p,w})=>`<div class="wrow"><div class="t"><span class="en">${esc(enDisp(w))}</span>${w.ipa?`<span class="ipa">[${esc(w.ipa)}]</span>`:''}${plNoteHTML(w)}<div class="de">${esc(w.de)}</div>
      <div class="small muted">Seite ${p.page}${p.title?' · '+esc(p.title):''}</div></div>
      <button class="icon" data-act="sayRow" data-id="${esc(w.id)}" aria-label="Anhören">🔊</button>
      <button class="icon" data-act="editFound" data-id="${esc(w.id)}" aria-label="Bearbeiten">✏️</button></div>`).join('')}</div>`;
}

/* ----- Übung starten ----- */
function startSession(){
  const sel=selectedPages(); if(!sel.length) return;
  unlockAudio();
  const dirs=dirsFromSetting();
  let items=buildItems(sel,dirs,false), replay=false;
  if(!items.length){ items=buildItems(sel,dirs,true); replay=true; }
  const n=DB.settings.size==='all' ? items.length : Math.min(+DB.settings.size, items.length);
  const queue=spreadSameWord(shuffle(weightedPick(items,n))).map(i=>({w:i.w,d:i.d,pageId:i.pageId,retried:false}));
  const theme = DB.settings.theme==='mix' ? pick(THEMES) : DB.settings.theme;
  S={queue, i:0, right:0, firstTry:0, firstTotal:0, results:[], mode:DB.settings.mode, theme, replay, sel, dirs, startedAt:Date.now(), ph:'ask', tries:0, combo:0, restart:null};
  DB.stats.sessions++; save();
  UI.screen='quiz'; render(); window.scrollTo(0,0);
}
function sessionCounts(){
  const items=buildItems(S.sel,S.dirs,true);
  return countLevels(items);
}
// Gezielt aus einem Topf üben (Töpfe-Tab)
function startFromPot(d, k, nSel){
  const key = k==='w' ? -1 : k==='n' ? 0 : +k;
  const ids=DB.pages.map(p=>p.id);
  let items=shuffle(buildItems(ids,[d],true).filter(i=>i.lvl===key));
  if(!items.length) return;
  const n = nSel==='all' ? items.length : Math.min(+nSel, items.length);
  unlockAudio();
  const queue=items.slice(0,n).map(i=>({w:i.w,d:i.d,pageId:i.pageId,retried:false}));
  const theme = DB.settings.theme==='mix' ? pick(THEMES) : DB.settings.theme;
  S={queue, i:0, right:0, firstTry:0, firstTotal:0, results:[], mode:DB.settings.mode, theme, replay:false, sel:ids, dirs:[d], startedAt:Date.now(), ph:'ask', tries:0, combo:0,
     restart:()=>startFromPot(d,k,nSel)};
  DB.stats.sessions++; save(); closeSheet();
  UI.screen='quiz'; render(); window.scrollTo(0,0);
}
function curItem(){ return S.queue[S.i]; }

/* ----- Antwort auswerten ----- */
function judgeTyped(v){
  if(S.ph!=='ask') return;
  const it=curItem(), dir=DIRS[it.d];
  if(matchTyped(it.w,dir.to,v)) return finishCard(true);
  S.tries++;
  if(S.tries<2){
    $('#qcard').classList.remove('shake'); void $('#qcard').offsetWidth; $('#qcard').classList.add('shake');
    SND.bad();
    renderAnswerArea(`Fast! Du hast „${v}“ geschrieben.`);
  }else finishCard(false, v);
}
function judgeSpoken(list){
  if(S.ph!=='ask') return;
  const it=curItem(), dir=DIRS[it.d];
  if(matchSpoken(it.w,dir.to,list)) return finishCard(true);
  S.tries++;
  if(S.tries<2){
    $('#qcard').classList.remove('shake'); void $('#qcard').offsetWidth; $('#qcard').classList.add('shake');
    SND.bad();
    renderAnswerArea(`Ich habe verstanden: „${list[0]}“. Nicht ganz – versuch es nochmal!`);
  }else finishCard(false, list[0]);
}
function startListening(){
  if(!SR){ toast('Spracherkennung geht hier nicht – nimm „Schreiben“ oder „Aufdecken“.'); return; }
  if(S.ph!=='ask') return;
  if(rec){ stopListening(false); return; }
  stopSpeaking();
  const it=curItem(), dir=DIRS[it.d];
  let finalList=[], heard='', err='', timer=null, early=null;
  try{
    rec=new SR(); rec.lang = dir.to==='en' ? 'en-GB' : 'de-DE';
    rec.interimResults=true; rec.maxAlternatives=5; rec.continuous=false;
  }catch(e){ rec=null; toast('Mikrofon konnte nicht gestartet werden.'); return; }
  const r=rec;
  r.onstart=()=>{ const m=$('#micbtn'); if(m) m.classList.add('live'); const l=$('#miclabel'); if(l) l.textContent='Ich höre zu … sprich jetzt!'; };
  const judgeNow=list=>{
    clearTimeout(early); clearTimeout(timer);
    stopListening(true);               // rec = null; das spätere onend wird ignoriert
    const m=$('#micbtn'); if(m) m.classList.remove('live');
    if(S && S.ph==='ask' && curItem()===it) judgeSpoken(list);
  };
  r.onresult=e=>{
    if(rec!==r) return;
    const res=e.results[e.results.length-1]; heard=res[0].transcript;
    const hd=$('#heard'); if(hd) hd.textContent='„'+heard+'“';
    const alts=[...res].map(a=>a.transcript);
    clearTimeout(early);
    if(res.isFinal){ finalList=alts; judgeNow(alts); return; }   // sofort, nicht auf das Ende der Erkennung warten
    // Zwischenergebnis passt schon genau? Dann nach kurzer Stabilitäts-Pause gleich werten.
    if(matchSpoken(it.w,dir.to,alts,true)) early=setTimeout(()=>{ if(rec===r) judgeNow(alts); },450);
  };
  r.onerror=e=>{ err=e.error||'error'; };
  r.onend=()=>{
    clearTimeout(timer); clearTimeout(early);
    if(rec!==r) return;
    rec=null;
    const m=$('#micbtn'); if(m) m.classList.remove('live');
    if(!S || S.ph!=='ask' || curItem()!==it) return;
    if(finalList.length || heard){ judgeSpoken(finalList.length?finalList:[heard]); return; }
    const l=$('#miclabel');
    if(err==='not-allowed'||err==='service-not-allowed'){
      if(l) l.textContent='Mikrofon nicht erlaubt.';
      toast('Mikrofon ist blockiert. Erlaube es im Browser (und aktiviere die Diktierfunktion) – oder nimm „Schreiben“.');
    }else if(l) l.textContent = err==='no-speech' ? 'Ich habe nichts gehört – tippe nochmal aufs Mikro.' : 'Das hat nicht geklappt – tippe nochmal aufs Mikro.';
  };
  try{ r.start(); timer=setTimeout(()=>{ try{ r.stop(); }catch(e){} }, 7000); }
  catch(e){ rec=null; toast('Mikrofon konnte nicht gestartet werden.'); }
}
function stopListening(silent){
  if(!rec) return;
  const r=rec; if(silent){ rec=null; }
  try{ r.stop(); }catch(e){}
}

function finishCard(ok, typedOrHeard){
  if(S.ph!=='ask' && S.ph!=='self') return;
  stopListening(true); rec=null;
  S.ph='result';
  const it=curItem(), w=it.w, dir=DIRS[it.d];
  const first=!it.retried;
  const toLvl=nextLevel(S.fromLvl, ok);
  setLvl(w.id,it.d,toLvl);
  const pr=(DB.prog[w.id] ||= {}); ok ? pr.r=(pr.r||0)+1 : pr.w=(pr.w||0)+1;
  logAnswer(ok); save();
  S.results.push({w,d:it.d,ok,first,from:S.fromLvl,to:toLvl});
  if(ok){ S.right++; if(first) S.firstTry++; }
  if(first) S.firstTotal++;
  S.last={ok,toLvl,it};
  // Falsch beantwortete Karte kommt später in dieser Runde noch einmal
  if(!ok && !it.retried){
    const pos=Math.min(S.i+4, S.queue.length);
    S.queue.splice(pos,0,{w,d:it.d,pageId:it.pageId,retried:true});
  }
  showResult(ok, toLvl);
}
function showResult(ok, toLvl){
  const it=curItem(), w=it.w;
  const fromKey=lvlKey(S.fromLvl), toKey=lvlKey(toLvl), done=toLvl===DONE;
  S.combo = ok ? (S.combo||0)+1 : 0;
  const cm = ok ? COMBO[S.combo] : null;
  const msg = ok ? (cm ? pick(cm) : praiseText()) : pick(OOPS);
  const moved = ok ? (done ? 'Geschafft! Diese Vokabel ist erledigt! 🏆' : `Ab in Topf ${toLvl}!`)
                   : (toLvl===-1 ? 'Ab in den Falsch-Topf.' : `Einen Topf zurück (Topf ${toLvl}).`);
  const showOverride = !ok && S.mode==='speak';
  $('#ans').innerHTML='';
  const sc=$('#score'); if(sc) sc.innerHTML=scoreHTML();
  $('#qfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">
    <div class="fbhead">${ok?pick(EMO):'🦉'} ${esc(msg)}</div>
    ${solHTML(w)}
    ${audioRow(w,['en','de'])}
    <div class="small" style="font-weight:800;margin-top:6px">${moved}</div>
    ${showOverride?`<button class="link" data-act="override">🎤 Ich habe es richtig gesagt – die App hat mich falsch verstanden</button>`:''}
    <button class="link" data-act="editCur">✏️ Vokabel korrigieren</button>
    <button class="btn next ${ok?'good':''}" data-act="next">Weiter ▶</button></div>`;
  const card=$('#qcard'); card.classList.add(ok?'hop':'shake');
  // Sofort-Belohnung (bei "erledigt" kommt der große Effekt erst, wenn die Vokabel im Pokal landet)
  if(ok){
    if(cm) SND.combo(); else SND.ok(S.combo);
    if(!done) reward(cm ? 1.8 : 1);
    cheer(msg, !!cm);
  }else SND.bad();
  // Flug: Karte -> Topf, in dem sie lag -> Ziel-Topf
  const srcEl=$(`.pot[data-k="${fromKey}"]`), dstEl=$(`.pot[data-k="${toKey}"]`);
  if(srcEl) srcEl.classList.remove('src');
  const after=sessionCounts(), mid={...after}; mid[toKey]=Math.max(0,(mid[toKey]||0)-1);
  const txt=(DIRS[it.d].from==='en'?enDisp(w):w.de).replace(/\([^)]*\)/g,'').trim().slice(0,22);
  const sess=S, idx=S.i, here=()=>S===sess && S.i===idx && $('#pots');
  const setPots=c=>{ const p=$('#pots'); if(p) p.innerHTML=potsHTML(c,S.theme,{}); };
  flyJourney({fromRect:card.getBoundingClientRect(), srcEl, dstEl, text:txt, ok,
    onDrop:()=>{ if(!here()) return; setPots(mid); popEl($(`.pot[data-k="${fromKey}"]`)); },
    onLand:(x,y)=>{
      // Wurde schon "Weiter" getippt, ist die nächste Karte frisch gezeichnet – dann nur noch Effekte.
      if(here()){ setPots(after); popEl($(`.pot[data-k="${toKey}"]`)); }
      if(done){ SND.done(); burst(x,y,26,['🏆','⭐','🎉','✨','💛']); reward(2.4); cheer('Vokabel erledigt! 🏆',true); }
      else if(ok) burst(x,y,9);
    }});
  if(DB.settings.speakA) setTimeout(()=>{ if(S&&S.ph==='result') sayWord(w,'en'); }, 500);
  $('#qfb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
// Sprecher sagt "richtig", die App hat sich verhört → Korrektur
function overrideCorrect(){
  if(!S||S.ph!=='result'||!S.last||S.last.ok) return;
  const it=S.last.it, w=it.w;
  // letzten Eintrag rückgängig machen und als richtig werten
  const res=S.results.pop();
  const pr=DB.prog[w.id]; if(pr&&pr.w) pr.w--;
  DB.stats.wrong=Math.max(0,DB.stats.wrong-1);
  const retryIdx=S.queue.findIndex((q,i)=>i>S.i && q.retried && q.w.id===w.id && q.d===it.d);
  if(retryIdx>=0) S.queue.splice(retryIdx,1);
  S.ph='self'; S.fromLvl=res.from;
  if(res.first) S.firstTotal--;
  finishCard(true);
}

const KEYSTORE='vokabel-helden.apikey';   // bewusst NICHT in DB, damit der Schlüssel nie im Backup landet
function getKey(){ try{ return localStorage.getItem(KEYSTORE)||''; }catch(e){ return ''; } }
function setKey(k){ try{ k ? localStorage.setItem(KEYSTORE,k) : localStorage.removeItem(KEYSTORE); }catch(e){} }

function prepareImage(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    const fail=()=>{ URL.revokeObjectURL(url); reject(Object.assign(new Error('Bild'),{kind:'image'})); };
    img.onload=()=>{
      try{
        const W=img.naturalWidth, H=img.naturalHeight; if(!W||!H) throw new Error('size');
        const draw=(max,q)=>{ const sc=Math.min(1,max/Math.max(W,H)); const c=document.createElement('canvas');
          c.width=Math.round(W*sc); c.height=Math.round(H*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); };
        const full=draw(1800,0.85), thumb=draw(320,0.7);
        URL.revokeObjectURL(url);
        resolve({b64:full.split(',')[1], thumb, w:Math.min(W,1800)});
      }catch(e){ fail(); }
    };
    img.onerror=fail;
    img.src=url;
  });
}
async function callClaude(content, maxTokens){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),120000);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', signal:ctl.signal,
      headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:DB.settings.scanModel||DEF.scanModel, max_tokens:maxTokens, messages:[{role:'user',content}]})
    });
    let j=null; try{ j=await res.json(); }catch(e){}
    if(!res.ok){ const err=new Error((j&&j.error&&j.error.message)||('HTTP '+res.status)); err.status=res.status; throw err; }
    return ((j&&j.content)||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  } finally { clearTimeout(timer); }
}
function scanError(e){
  const m=String(e&&e.message||'');
  if(e&&e.kind==='image') return 'Dieses Foto kann ich nicht öffnen. Bitte ein normales Foto (JPG/PNG) wählen.';
  if(e&&e.name==='AbortError') return 'Das hat zu lange gedauert. Bitte nochmal versuchen.';
  if(e instanceof TypeError) return 'Keine Verbindung zum Internet (oder die Anfrage wurde blockiert). Bitte Verbindung prüfen und nochmal versuchen.';
  switch(e&&e.status){
    case 401: case 403: return 'Der Schlüssel wurde abgelehnt. Bitte in den Einstellungen prüfen oder neu eintragen.';
    case 400: return /credit|balance|billing/i.test(m) ? 'Das Guthaben beim API-Konto ist aufgebraucht. Bitte in der Anthropic-Console Guthaben aufladen.' : 'Die Anfrage wurde abgelehnt: '+m;
    case 404: return 'Das ausgewählte Modell gibt es nicht. Bitte in den Einstellungen ein anderes Modell wählen.';
    case 413: return 'Das Foto ist zu groß.';
    case 429: return 'Gerade zu viele Anfragen. Bitte in einer Minute nochmal versuchen.';
  }
  if(e&&e.status>=500) return 'Der Dienst ist gerade überlastet. Bitte gleich nochmal versuchen.';
  return 'Fehler: '+m;
}
function busyHTML(msg){ return `<div class="scanbusy"><div class="owl">🦉</div><div><b>${esc(msg)}<span class="dots"></span></b><div class="small muted">Das dauert etwa 10–20 Sekunden.</div></div></div>`; }
function setScanStatus(msg){ const el=$('#scanStatus'); if(el) el.innerHTML=busyHTML(msg); }
async function scanFiles(fileList){
  const s=importState; if(!s||s.busy) return;
  const files=[...fileList]; if(!files.length) return;
  if(!getKey()){ toast('Bitte zuerst den Schlüssel eintragen.'); return; }
  readImportFields(); s.busy=true; s.scanErr=''; s.thumbs=[];
  const texts=[]; let err=null;
  try{
    for(let i=0;i<files.length;i++){
      setScanStatus(files.length>1 ? `Foto ${i+1} von ${files.length} wird gelesen` : 'Foto wird gelesen');
      const img=await prepareImage(files[i]); s.thumbs.push(img.thumb);
      texts.push(await callClaude([{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.b64}},{type:'text',text:AI_PROMPT}],4000));
    }
  }catch(e){ err=e; }
  s.busy=false;
  if(err) s.scanErr=scanError(err);
  if(texts.length){
    s.text=[s.text.trim(), ...texts.map(t=>t.replace(/^\s*```.*$/gm,'').trim())].filter(Boolean).join('\n');
    const ta=$('#impText'); if(ta) ta.value=s.text;   // doParse() liest die Felder neu ein
    doParse();
  }else renderImport();
}
function consolidatePages(pages){
  const out=[];
  pages.forEach(pg=>{ const ex=pg.page && out.find(o=>o.page===pg.page);
    if(ex){ ex.words.push(...pg.words); if(!ex.title) ex.title=pg.title; } else out.push(pg); });
  return out;
}

  return `<div class="panel"><h3>📷 Foto-Scan (für Eltern)</h3>
    <p class="small" style="margin:0 0 10px">Damit die App Vokabelseiten per Foto einliest, braucht sie einmalig einen <b>Claude-API-Schlüssel</b>. Er wird nur auf diesem Gerät gespeichert – nicht im Backup und nicht auf GitHub. Beim Scannen wird das Foto zur Erkennung an Anthropic gesendet.</p>
    ${k ? `<div class="note ok">✅ Schlüssel gespeichert (…${esc(k.slice(-4))})</div>
      <div class="seg"><button data-act="testKey">🔌 Testen</button><button data-act="removeKey">🗑️ Entfernen</button></div>`
        : `<label class="field"><span>API-Schlüssel</span><input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
      <button class="btn good" data-act="saveKey">Schlüssel speichern</button>`}
    <label class="field" style="margin-top:14px"><span>Modell</span><select data-sel="scanModel">${models.map(([v,t])=>`<option value="${v}" ${(st.scanModel||DEF.scanModel)===v?'selected':''}>${t}</option>`).join('')}</select></label>
    <details class="how"><summary>So bekommst du einen Schlüssel</summary>
      <ol class="steps"><li>Auf <b>console.anthropic.com</b> anmelden. Das ist ein eigenes Konto, getrennt vom Claude-Abo.</li>
      <li>Unter „Billing“ Guthaben aufladen (ein paar Euro reichen) und möglichst ein Monatslimit setzen.</li>
      <li>Unter „API Keys“ einen neuen Schlüssel erstellen, kopieren und hier einfügen.</li>
      <li>Eine Seite kostet in der Regel nur wenige Cent.</li></ol></details></div>`;
}
document.addEventListener('change',e=>{
  const t=e.target;
  if((t.id==='scanCam'||t.id==='scanLib') && t.files && t.files.length){ const f=[...t.files]; t.value=''; scanFiles(f); }
});
function renderImport(){
  const s=importState, p=s.parsed;
  let prev='';
  if(p){
    prev=`<div class="panel" id="prevPanel"><h3>Vorschau</h3>
      ${s.thumbs&&s.thumbs.length?`<div class="thumbs">${s.thumbs.map(u=>`<img src="${u}" alt="Foto">`).join('')}</div>`:''}
      <p class="small muted" style="margin:0 0 10px">Bitte kurz mit dem Buch vergleichen. Stimmt etwas nicht, oben im Textfeld korrigieren und nochmal auf „Prüfen“ tippen.</p>
      ${p.pages.map(pg=>`<p style="margin:0 0 6px"><b>Seite ${pg.page||'?'} – ${esc(pg.title||'ohne Titel')}</b> · ${pg.words.length} Vokabeln${getPage('p'+pg.page)?' <span style="color:var(--bad-d)">(ersetzt die vorhandene Seite, der Lernstand bleibt erhalten)</span>':''}</p>
      <table class="prev">${pg.words.map(w=>`<tr><td>${esc(w.en)}${w.ipa?` <span class="muted" style="font-weight:600">[${esc(w.ipa)}]</span>`:''}</td><td>${esc(w.de)}</td></tr>`).join('')}</table>`).join('<hr>')}
      ${p.warnings.length?`<div class="note warn" style="margin-top:10px">${p.warnings.map(esc).join('<br>')}</div>`:''}
      ${p.pages.every(pg=>pg.page)?'':`<div class="note warn" style="margin-top:10px">Bitte gib oben die Seitenzahl an.</div>`}
      <button class="btn good big" style="width:100%;margin-top:12px" data-act="saveImport" ${p.pages.length&&p.pages.every(pg=>pg.page)?'':'disabled'}>✅ Speichern</button></div>`;
  }
  app.innerHTML=`<div class="sub">
    <div class="subtop"><button class="icon" data-act="home2">←</button><h2>Seite hinzufügen</h2></div>
    ${scanPanelHTML()}
    <div class="panel"><h3>Oder von Hand ohne Foto-Scan</h3>
      <ol class="steps"><li>Foto von der Vokabelseite machen.</li>
      <li>Foto in <b>Claude</b> (oder ChatGPT / Gemini) hochladen und diesen Auftrag dazuschreiben:
        <div class="prompt" id="aiPrompt">${esc(AI_PROMPT)}</div>
        <button class="btn sm ghost" data-act="copyPrompt">📋 Auftrag kopieren</button></li>
      <li>Die Antwort hier unten einfügen und auf „Prüfen“ tippen.</li></ol></div>
    <div class="panel">
      <div class="two"><label class="field"><span>Seite</span><input id="impPage" type="number" inputmode="numeric" placeholder="190" value="${esc(s.page)}"></label>
      <label class="field"><span>Überschrift (optional)</span><input id="impTitle" type="text" placeholder="Nice to meet you!" value="${esc(s.title)}"></label></div>
      <label class="field"><span>Vokabeln (eine pro Zeile: englisch [Lautschrift] | deutsch)</span>
      <textarea id="impText" placeholder="nice [naɪs] | nett, schön&#10;meet [miːt] | kennenlernen; treffen" autocapitalize="none" autocorrect="off" spellcheck="false">${esc(s.text)}</textarea></label>
      <div class="seg"><button data-act="pasteClip">📥 Aus Zwischenablage</button><button class="on" data-act="parseImport">🔍 Prüfen</button></div>
    </div>
    ${prev}</div>`;
}
function readImportFields(){
  const s=importState; if(!s) return;
  s.page=($('#impPage')||{}).value||''; s.title=($('#impTitle')||{}).value||''; s.text=($('#impText')||{}).value||'';
}
function doParse(){
  readImportFields(); const s=importState;
  const parsed=parseVocabText(s.text.replace(/^\s*```.*$/gm,''), s.page?+s.page:null, s.title);
  parsed.pages=consolidatePages(parsed.pages);
  parsed.pages.forEach(pg=>{ if(!pg.page && s.page) pg.page=+s.page; if(!pg.title && s.title) pg.title=s.title; });
  s.parsed=parsed;
  if(!parsed.pages.length) toast('Ich habe keine Vokabeln erkannt. Format: englisch | deutsch');
  renderImport();
  if(parsed.pages.length) setTimeout(()=>{ const el=$('.panel h3'); const prevEl=$$('.panel').pop(); if(prevEl) prevEl.scrollIntoView({behavior:'smooth',block:'start'}); },50);
}
function saveImport(){
  const p=importState.parsed; if(!p) return;
  const ids=[];
  p.pages.forEach(pg=>{ const page=mergePage(DB,pg); ids.push(page.id); });
  ids.forEach(id=>{ if(!DB.settings.selected.includes(id)) DB.settings.selected.push(id); });
  save(); importState=null;
  toast(`Gespeichert: ${p.pages.reduce((s,x)=>s+x.words.length,0)} Vokabeln 🎉`);
  UI.screen=null; UI.tab='learn'; render(); window.scrollTo(0,0);
}

/* ----- Seite bearbeiten ----- */
function renderEditPage(){
  const p=getPage(editPageId); if(!p){ UI.screen=null; return render(); }
  app.innerHTML=`<div class="sub">
    <div class="subtop"><button class="icon" data-act="home2">←</button><h2>Seite ${p.page}</h2></div>
    <div class="panel"><div class="two"><label class="field"><span>Seite</span><input id="epPage" type="number" inputmode="numeric" value="${p.page}"></label>
      <label class="field"><span>Überschrift</span><input id="epTitle" type="text" value="${esc(p.title||'')}"></label></div>
      <label class="field"><span>Gruppe (optional, z. B. „Unit 1“)</span><input id="epGroup" type="text" value="${esc(p.group||'')}" placeholder="${esc(p.title||'')}"></label>
      <p class="small muted" style="margin:-4px 0 10px">Seiten mit gleicher Gruppe (sonst gleicher Überschrift) werden auf der Startseite zusammengefasst und lassen sich zuklappen.</p>
      <button class="btn sm" data-act="savePageMeta">Speichern</button></div>
    <div class="panel"><h3>${p.words.length} Vokabeln</h3>
      ${p.words.map(w=>`<div class="wrow"><div class="t"><span class="en">${esc(enListTxt(w))}</span>${w.ipa?`<span class="ipa">[${esc(w.ipa)}]</span>`:''}<div class="de">${esc(w.de)}</div></div>
        <button class="icon" data-act="editWord" data-id="${esc(w.id)}" aria-label="Bearbeiten">✏️</button></div>`).join('')}
      <button class="btn good" style="margin-top:12px;width:100%" data-act="addWord">➕ Vokabel hinzufügen</button></div>
    <button class="btn bad" style="width:100%" data-act="deletePage">🗑️ Ganze Seite löschen</button></div>`;
}
let wfCtx='page';
function findWord(id){ for(const p of DB.pages){ const w=p.words.find(x=>x.id===id); if(w) return {p,w}; } return null; }
function afterWordSave(){
  if(wfCtx==='quiz') refreshQuizWord();
  else if(wfCtx==='search') renderSearchResults();
  else renderEditPage();
}
function wordForm(w, ctx){
  wfCtx=ctx||'page';
  w=w||{en:'',ipa:'',de:'',deOk:[]};
  showSheet(`<h3>${w.id?'Vokabel bearbeiten':'Neue Vokabel'}</h3>
    <label class="field"><span>Englisch</span><input id="wfEn" type="text" value="${esc(w.en)}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="field"><span>Lautschrift (optional)</span><input id="wfIpa" type="text" value="${esc(w.ipa)}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="field"><span>Deutsch</span><input id="wfDe" type="text" value="${esc(w.de)}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <label class="field"><span>Weitere richtige deutsche Antworten (mit ; trennen, optional)</span><input id="wfOk" type="text" value="${esc((w.deOk||[]).join('; '))}" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
    <p class="small muted" style="margin:-4px 0 10px">Tipp: Mehrzahl-Hinweise („fish, pl fish“) und Klammern („listen (to)“) versteht die App – bei Klammern gilt beides als richtig.</p>
    <div class="btns">${w.id&&wfCtx!=='quiz'?'<button class="btn bad" data-act="delWord" data-id="'+esc(w.id)+'">Löschen</button>':''}<button class="btn ghost" data-act="closeSheet">Abbrechen</button><button class="btn good" data-act="saveWord" data-id="${esc(w.id||'')}">Speichern</button></div>`);
}

/* =====================================================================
   Ereignisse
   ===================================================================== */
const A={
  tab:t=>go(t.dataset.tab),
  togglePage:t=>{ const id=t.dataset.id, s=DB.settings.selected, i=s.indexOf(id); i>=0?s.splice(i,1):s.push(id); save(); render(); },
  selAll:()=>{ DB.settings.selected=DB.pages.map(p=>p.id); save(); render(); },
  selNone:()=>{ DB.settings.selected=[]; save(); render(); },
  setOpt:t=>{ DB.settings[t.dataset.k]=t.dataset.v; save(); render(); },
  start:()=>startSession(),
  potSheet:t=>potSheet(t.dataset.d, t.closest('.pot').dataset.k),
  closeSheet:()=>closeSheet(),
  toggle:t=>{ const k=t.dataset.k; DB.settings[k]=!DB.settings[k]; save(); render(); },
  testVoice:t=>{ unlockAudio(); say(t.dataset.l==='en'?'Hello! Nice to meet you!':'Hallo! Schön, dich zu sehen!', t.dataset.l); },
  resetProgress:async()=>{ if(await askConfirm('Wirklich den ganzen Lernstand zurücksetzen?','Ja, zurücksetzen',true)){ DB.prog={}; DB.stats={days:[],right:0,wrong:0,sessions:0,today:{d:'',n:0}}; save(); toast('Lernstand zurückgesetzt'); render(); } },
  say:t=>{ unlockAudio(); const it=S&&curItem(); if(it) sayWord(it.w,t.dataset.k); },
  mic:()=>startListening(),
  giveup:()=>{ if(S&&S.ph==='ask') finishCard(false); },
  reveal:()=>{
    if(S.ph!=='ask') return; S.ph='self'; const it=curItem(), w=it.w;
    $('#ans').innerHTML=`<div class="sol" style="margin:6px 0 10px"><b>${esc(DIRS[it.d].to==='en'?enDisp(w):w.de)}</b>${DIRS[it.d].to==='en'&&w.ipa?` <span class="ipa" style="color:var(--primary-d)">[${esc(w.ipa)}]</span>`:''}${DIRS[it.d].to==='en'?plNoteHTML(w):''}</div>
      <div class="muted small" style="margin-bottom:8px">Wusstest du es?</div>
      <div class="seg"><button class="btn bad" style="flex:1" data-act="selfNo">😕 Nein</button><button class="btn good" style="flex:1" data-act="selfYes">😀 Ja!</button></div>`;
    sayWord(w, DIRS[it.d].to==='en'?'en':'de');
  },
  selfYes:()=>finishCard(true),
  selfNo:()=>finishCard(false),
  override:()=>overrideCorrect(),
  next:()=>nextCard(),
  quit:async()=>{ if(await askConfirm('Übung beenden? Dein Fortschritt bleibt gespeichert.','Beenden')){ stopSpeaking(); stopListening(true); S=null; UI.screen=null; render(); } },
  again:()=>{ if(S&&S.restart) S.restart(); else startSession(); },
  startPot:t=>startFromPot(t.dataset.d, t.dataset.k, t.dataset.n),
  sheetMode:t=>{ DB.settings.mode=t.dataset.v; save(); potSheet(t.dataset.d, t.dataset.k); },
  testReward:()=>{ unlockAudio(); reward(1.6); cheer(pick(PRAISE)); SND.ok(2); },
  againWrong:()=>startWrongOnly(),
  home:()=>{ S=null; go('learn'); },
  home2:()=>{ importState=null; UI.screen=null; render(); window.scrollTo(0,0); },
  openImport:()=>openImport(),
  copyPrompt:async t=>{ try{ await navigator.clipboard.writeText(AI_PROMPT); toast('Auftrag kopiert ✔'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#aiPrompt')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text ist markiert – jetzt kopieren'); } },
  pasteClip:async()=>{ try{ const tx=await navigator.clipboard.readText(); $('#impText').value=tx; toast('Eingefügt'); }catch(e){ toast('Bitte lange auf das Textfeld tippen und „Einfügen“ wählen.'); } },
  parseImport:()=>doParse(),
  scanCam:()=>{ const i=$('#scanCam'); if(i) i.click(); },
  scanLib:()=>{ const i=$('#scanLib'); if(i) i.click(); },
  goSettings:()=>{ importState=null; UI.tab='settings'; UI.screen=null; render(); window.scrollTo(0,0); },
  saveKey:()=>{
    const v=($('#apiKey')||{}).value||''; const k=v.replace(/\s+/g,'');
    if(!/^sk-ant-/.test(k)){ toast('Das sieht nicht wie ein Schlüssel aus – er beginnt mit „sk-ant-“.'); return; }
    setKey(k); toast('Schlüssel gespeichert ✔'); render();
  },
  removeKey:async()=>{ if(await askConfirm('Schlüssel von diesem Gerät entfernen?','Entfernen',true)){ setKey(''); toast('Schlüssel entfernt'); render(); } },
  testKey:async()=>{
    toast('Teste …');
    try{ await callClaude([{type:'text',text:'Antworte nur mit: OK'}],10); toast('Der Schlüssel funktioniert ✔'); }
    catch(e){ toast(scanError(e)); }
  },
  saveImport:()=>saveImport(),
  editPage:t=>{ editPageId=t.dataset.id; UI.screen='editpage'; render(); window.scrollTo(0,0); },
  savePageMeta:()=>{ const p=getPage(editPageId); const n=+($('#epPage').value)||p.page; const t=$('#epTitle').value.trim();
    if(n!==p.page && DB.pages.some(x=>x!==p&&x.page===n)){ toast('Diese Seitenzahl gibt es schon.'); return; }
    const gr=($('#epGroup')||{}).value; if(gr!=null){ gr.trim()?p.group=gr.trim():delete p.group; }
    p.page=n; p.title=t; DB.pages.sort((a,b)=>a.page-b.page); save(); toast('Gespeichert'); renderEditPage(); },
  editWord:t=>wordForm(getPage(editPageId).words.find(w=>w.id===t.dataset.id),'page'),
  addWord:()=>wordForm(null,'page'),
  saveWord:t=>{
    const found=t.dataset.id ? findWord(t.dataset.id) : null;
    const p=found ? found.p : getPage(editPageId), en=$('#wfEn').value.trim(), de=$('#wfDe').value.trim();
    if(!en||!de){ toast('Englisch und Deutsch ausfüllen.'); return; }
    const ipa=$('#wfIpa').value.trim().replace(/^\[|\]$/g,''), ok=$('#wfOk').value.split(';').map(s=>s.trim()).filter(Boolean);
    let w=found && found.w;
    if(w){ w.en=en; w.ipa=ipa; w.de=de; ok.length?w.deOk=ok:delete w.deOk; }
    else{ let id=p.id+':'+slug(en), k=2; while(p.words.some(x=>x.id===id)) id=p.id+':'+slug(en)+'#'+(k++); w={id,en,ipa,de}; if(ok.length) w.deOk=ok; p.words.push(w); }
    save(); closeSheet(); afterWordSave();
  },
  delWord:async t=>{ const f=findWord(t.dataset.id); if(f && await askConfirm('Diese Vokabel löschen?','Löschen',true)){ f.p.words=f.p.words.filter(w=>w.id!==t.dataset.id); delete DB.prog[t.dataset.id]; save(); closeSheet(); afterWordSave(); } },
  editCur:()=>{ if(!S) return; const it=curItem(); const f=it&&findWord(it.w.id); if(!f) return; stopListening(true); const m=$('#micbtn'); if(m) m.classList.remove('live'); wordForm(f.w,'quiz'); },
  editFound:t=>{ const f=findWord(t.dataset.id); if(f) wordForm(f.w,'search'); },
  sayRow:t=>{ unlockAudio(); const f=findWord(t.dataset.id); if(f) say(speakText(f.w,'en'),'en',DB.settings.rate); },
  toggleGroup:t=>{ const k=t.dataset.key, o=DB.settings.open||{}; const cur=k in o ? o[k] : groupDefaultOpen(k); DB.settings.open={...o,[k]:!cur}; save(); render(); },
  selGroup:t=>{ const g=pageGroups().find(x=>x.key===t.dataset.key); if(!g) return; const ids=g.pages.map(p=>p.id), sel=DB.settings.selected, all=ids.every(i=>sel.includes(i));
    DB.settings.selected = all ? sel.filter(i=>!ids.includes(i)) : [...new Set([...sel,...ids])]; save(); render(); },
  deletePage:async()=>{ const p=getPage(editPageId); if(await askConfirm(`Seite ${p.page} mit ${p.words.length} Vokabeln wirklich löschen?`,'Löschen',true)){
      p.words.forEach(w=>delete DB.prog[w.id]); DB.pages=DB.pages.filter(x=>x!==p); DB.settings.selected=DB.settings.selected.filter(i=>i!==p.id); save(); UI.screen=null; UI.tab='words'; render(); } },
  exportBackup:async()=>{
    let withKey=false;
    if(getKey()) withKey=await askConfirm('Soll der API-Schlüssel mit in die Sicherung? Praktisch für dein eigenes zweites Gerät – die Datei dann nicht weitergeben.','Ja, mitnehmen',false,'Nein, ohne');
    const blob=new Blob([JSON.stringify(withKey?{...DB,_apiKey:getKey()}:DB,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vokabel-helden-sicherung-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); },1000);
  },
  importBackup:()=>$('#backupFile').click()
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const f=A[t.dataset.act]; if(f){ e.preventDefault(); f(t,e); }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='backupFile' && t.files[0]){
    try{
      const j=JSON.parse(await t.files[0].text());
      if(!j||!Array.isArray(j.pages)) throw new Error('format');
      if(await askConfirm('Sicherung laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.','Laden',true)){
        const kk=j._apiKey; delete j._apiKey; if(kk) setKey(kk);
        DB=j; DB.prog=DB.prog||{}; DB.settings={...DEF,...(DB.settings||{})}; DB.stats=Object.assign({days:[],right:0,wrong:0,sessions:0,today:{d:'',n:0}},DB.stats||{});
        save(); toast('Sicherung geladen ✔'); render();
      }
    }catch(err){ toast('Diese Datei ist keine gültige Sicherung.'); }
    t.value='';
  }
  if(t.dataset && t.dataset.sel){ DB.settings[t.dataset.sel]=t.value; save(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='wsearch'){ UI.wq=t.value; renderSearchResults(); return; }
  if(t.dataset && t.dataset.range){ DB.settings[t.dataset.range]=+t.value; save(); }
  if(t.dataset && t.dataset.text){ DB.settings[t.dataset.text]=t.value; save(); }
});

/* ---------- Start ---------- */
try{
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
}catch(e){}
render();
